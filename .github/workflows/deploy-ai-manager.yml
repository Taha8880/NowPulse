name: NowPulse AI Manager Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ai-manager.js"
      - "ai-manager.wrangler.jsonc"
      - ".github/workflows/deploy-ai-manager.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy-ai-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check AI Manager syntax
        run: node --check ai-manager.js

      - name: Validate required files
        run: |
          test -f ai-manager.js
          test -f ai-manager.wrangler.jsonc

      - name: Validate Wrangler configuration
        run: |
          node -e "
          const fs = require('fs');
          const text = fs.readFileSync('ai-manager.wrangler.jsonc', 'utf8');
          const config = JSON.parse(text);

          if (config.name !== 'nowpulse-ai-manager') {
            throw new Error('Wrong Worker name');
          }

          if (config.main !== 'ai-manager.js') {
            throw new Error('Wrong Worker main file');
          }

          if (!config.ai || config.ai.binding !== 'AI') {
            throw new Error('Workers AI binding is missing');
          }

          if (
            !config.vars ||
            config.vars.NOWPULSE_GITHUB_REPO !== 'Taha8880/NowPulse'
          ) {
            throw new Error('GitHub repository configuration is missing');
          }

          if (
            !config.secrets ||
            !Array.isArray(config.secrets.required) ||
            !config.secrets.required.includes('GITHUB_TOKEN')
          ) {
            throw new Error('GITHUB_TOKEN must be declared as a required secret');
          }

          console.log('AI Manager Wrangler configuration is valid');
          "

      - name: Deploy AI Manager
        run: |
          npx wrangler deploy --config ai-manager.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          sleep 5

          echo "Checking AI Manager health..."
          curl --fail --silent --show-error \
            https://nowpulse-ai-manager.tavengers16.workers.dev/health

          echo ""
          echo "Checking GitHub token..."
          curl --fail --silent --show-error \
            https://nowpulse-ai-manager.tavengers16.workers.dev/github-test

          echo ""
          echo "AI Manager deployment verification completed."
