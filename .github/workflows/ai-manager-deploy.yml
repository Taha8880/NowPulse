name: NowPulse AI Manager Deploy
on:
  push:
    branches: [main]
    paths:
      - "ai-manager.js"
      - "ai-manager.wrangler.jsonc"
      - "PROJECT_BASELINE.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check ai-manager.js
      - run: npx wrangler deploy --dry-run --config ai-manager.wrangler.jsonc
      - name: Deploy AI Manager
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ai-manager.wrangler.jsonc
      - name: Install GitHub token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOWPULSE_GITHUB_TOKEN: ${{ secrets.NOWPULSE_GITHUB_TOKEN }}
        run: printf '%s' "$NOWPULSE_GITHUB_TOKEN" | npx wrangler secret put NOWPULSE_GITHUB_TOKEN --config ai-manager.wrangler.jsonc
      - name: Verify AI Manager
        run: |
          set -e
          test_url="https://nowpulse-ai-manager.tavengers16.workers.dev/health"
          for i in $(seq 1 12); do
            x=$(curl -fsSL --max-time 15 "$test_url" || true)
            echo "$x"
            if echo "$x" | grep -q '"ok":true' && echo "$x" | grep -q '"ai":true'; then exit 0; fi
            sleep 5
          done
          exit 1
