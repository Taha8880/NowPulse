name: NowPulse Maintenance Trigger

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare maintenance Workflow
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          payload="$(node -e 'console.log(JSON.stringify({params:JSON.stringify({trigger:"github-actions",scheduledAt:new Date().toISOString()})}))')"
          response="$(curl -fsSL --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/nowpulse-maintenance/instances")"
          echo "$response"
          echo "$response" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const d=JSON.parse(s);
              if(!d.success) throw new Error("Workflow instance creation failed: "+JSON.stringify(d.errors||[]));
              if(!d.result?.id) throw new Error("Workflow instance ID missing");
              console.log("NowPulse maintenance instance started: "+d.result.id);
            });
          '
