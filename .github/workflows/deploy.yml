name: NowPulse Production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:contract
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          base=https://nowpulse.tavengers16.workers.dev
          for i in $(seq 1 18); do
            h=$(curl -fsSL --max-time 15 "$base/health" || true)
            echo "$h"
            if echo "$h" | grep -q '"ok":true' && echo "$h" | grep -q '"version":"9.0.0"'; then break; fi
            if [ "$i" = "18" ]; then exit 1; fi
            sleep 5
          done
          news="$(curl -fsSL "$base/api/news")"
          echo "$news"
          printf '%s' "$news" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x)||!x.length)process.exit(1)})'
          home="$(curl --compressed -fsSL --max-time 25 "$base/?lang=ar")"
          echo "$home" | grep -q "NowPulse"
          echo "$home" | grep -q "Created by Taha"
          echo "$home" | grep -q "نبض الآن"
          weather="$(curl -fsSL "$base/api/weather?city=cairo")"
          echo "$weather"
          printf '%s' "$weather" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Number.isFinite(Number(x.temperature)))process.exit(1)})'
          curl --compressed -fsSL "$base/robots.txt" | grep -q 'Sitemap'
          curl --compressed -fsSL "$base/sitemap.xml" | grep -q '<urlset'
