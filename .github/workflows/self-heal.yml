name: NowPulse Self Healing
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -fsSL https://nowpulse.tavengers16.workers.dev/health | grep -q '"ok":true'
          curl -fsSL https://nowpulse.tavengers16.workers.dev/api/news | grep -q '\['
          curl -fsSL https://nowpulse.tavengers16.workers.dev/api/markets | grep -q 'usdEgp'
          curl -fsSL https://nowpulse.tavengers16.workers.dev/sitemap.xml | grep -q '<urlset'