name: NowPulse CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:contract
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Install GitHub token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOWPULSE_GITHUB_TOKEN: ${{ secrets.NOWPULSE_GITHUB_TOKEN }}
        run: printf '%s' "$NOWPULSE_GITHUB_TOKEN" | npx wrangler secret put NOWPULSE_GITHUB_TOKEN --config wrangler.jsonc
      - name: Verify production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          base=https://nowpulse.tavengers16.workers.dev
          ok=0
          for i in $(seq 1 18); do
            h=$(curl -fsSL --max-time 15 "$base/health" || true)
            echo "$h"
            if echo "$h" | grep -q '"ok":true' && echo "$h" | grep -q '"version":"8.0.0"'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL "$base/api/news" | grep -q '\['
          curl -fsSL "$base/api/markets" | grep -q 'usdEgp'
          curl -fsSL "$base/sitemap.xml" | grep -q '<urlset'
          curl -fsSL "$base/api/search?q=Egypt" | grep -q '\['