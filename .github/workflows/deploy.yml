name: NowPulse CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate JavaScript
        run: npm run check

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Validate product contract
        run: npm run test:contract

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f src/worker.js
          test -f wrangler.jsonc
          test -f src/ai-guardian.js
          test -f src/nowpulse-maintenance-workflow.js
          test -f ai-manager.js
          test -f ai-manager.wrangler.jsonc
          test -f .github/workflows/validate-pr.yml
          test -f .github/workflows/self-heal.yml
          test -f .github/workflows/ai-repair-auto-merge.yml

      - name: Validate autonomous architecture
        run: |
          set -euo pipefail
          grep -q 'NowPulseGuardian' wrangler.jsonc
          grep -q 'NowPulseMaintenanceWorkflow' wrangler.jsonc
          grep -q '"type": "workflow"' wrangler.jsonc
          grep -q '"schedules"' wrangler.jsonc
          grep -q '*/15 * * * *' wrangler.jsonc
          grep -q 'NOWPULSE_GITHUB_TOKEN' src/nowpulse-maintenance-workflow.js
          grep -q 'getAgentByName' src/nowpulse-maintenance-workflow.js
          echo "Autonomous architecture contract passed."

      - name: Final CI result
        run: echo "NowPulse CI validation passed. Production deployment is managed by Cloudflare Workers Builds."