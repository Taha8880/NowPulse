name: NowPulse Production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:contract
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify production
        env:
          SITE: https://nowpulse.tavengers16.workers.dev
        run: |
          set -e
          sleep 8
          health="$(curl -fsSL --max-time 20 "$SITE/health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"version":"1.0.0"'
          curl -fsSL --max-time 25 "$SITE/?lang=ar" -o /tmp/home.html
          grep -q 'NowPulse' /tmp/home.html
          curl -fsSL --max-time 25 "$SITE/robots.txt" | grep -q 'Sitemap'
          curl -fsSL --max-time 25 "$SITE/sitemap.xml" | grep -q '<urlset'
          curl -fsSL --max-time 25 "$SITE/ads.txt" | grep -q 'pub-1235197294708204'
          news="$(curl -fsSL --max-time 35 "$SITE/api/news?lang=ar")"
          echo "$news" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.latest))process.exit(1)})'
          markets="$(curl -fsSL --max-time 25 "$SITE/api/markets")"
          echo "$markets" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x||typeof x!=="object")process.exit(1)})'
          weather="$(curl -fsSL --max-time 25 "$SITE/api/weather?city=cairo")"
          echo "$weather" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x||!("temperature" in x))process.exit(1)})'
