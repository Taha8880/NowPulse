name: NowPulse AI Manager Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ai-manager.js"
      - "ai-manager.wrangler.jsonc"
      - ".github/workflows/deploy-ai-manager.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy-ai-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check AI Manager syntax
        run: node --check ai-manager.js

      - name: Validate required files
        run: |
          test -f ai-manager.js
          test -f ai-manager.wrangler.jsonc

      - name: Validate Wrangler configuration
        run: |
          node -e "
          const fs = require('fs');
          const text = fs.readFileSync('ai-manager.wrangler.jsonc', 'utf8');
          JSON.parse(text);
          console.log('ai-manager.wrangler.jsonc is valid JSON');
          "

      - name: Check required AI Manager configuration
        run: |
          grep -q '"name": "nowpulse-ai-manager"' ai-manager.wrangler.jsonc
          grep -q '"main": "ai-manager.js"' ai-manager.wrangler.jsonc
          grep -q '"binding": "AI"' ai-manager.wrangler.jsonc
          grep -q '"NOWPULSE_GITHUB_REPO": "Taha8880/NowPulse"' ai-manager.wrangler.jsonc

      - name: Deploy AI Manager
        run: npx wrangler deploy --config ai-manager.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify AI Manager
        run: |
          sleep 5
          curl --fail --silent --show-error \
            https://nowpulse-ai-manager.tavengers16.workers.dev/health
