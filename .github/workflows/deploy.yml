name: NowPulse Production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:contract
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify production
        env:
          SITE: https://nowpulse.tavengers16.workers.dev
        run: |
          set -e
          sleep 25
          health="$(curl -fsSL --max-time 20 "$SITE/health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"version":"1.6.3"'
          curl -fsSL --max-time 25 "$SITE/?lang=ar" -o /tmp/home.html
          grep -q 'NowPulse' /tmp/home.html
          curl -fsSL --max-time 25 "$SITE/robots.txt" | grep -q 'Sitemap'
          curl -fsSL --max-time 25 "$SITE/sitemap.xml" | grep -q '<urlset'
          curl -fsSL --max-time 25 "$SITE/ads.txt" | grep -q 'pub-1235197294708204'
          news="$(curl -fsSL --max-time 35 "$SITE/api/news?lang=ar")"
          echo "$news" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.latest))process.exit(1)})'
          markets="$(curl -fsSL --max-time 25 "$SITE/api/markets")"
          echo "$markets" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);for(const k of ["usd","eur","gbp","sar","aed"])if(!(Number(x.fx?.[k]?.mid)>0))process.exit(1);for(const k of ["24K","21K","18K"])if(!(Number(x.gold?.[k]?.mid)>0))process.exit(1)})'
          weather="$(curl -fsSL --max-time 25 "$SITE/api/weather?city=cairo")"
          echo "$weather" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x||!(Number(x.temperature)>-90)&&x.temperature!==null)process.exit(1)})'
          pids=()
          for cat in latest egypt arab world politics sports economy tech arts health travel trends; do
            curl -fsSL --max-time 20 "$SITE/category/$cat?lang=ar" -o "/tmp/$cat.html" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for cat in latest egypt arab world politics sports economy tech arts health travel trends; do
            grep -q '<html' "/tmp/$cat.html"
            grep -q 'NowPulse' "/tmp/$cat.html"
          done
          curl -fsSL --max-time 25 "$SITE/search?q=%D9%85%D8%AD%D9%85%D8%AF%20%D8%B5%D9%84%D8%A7%D8%AD&lang=ar" -o /tmp/search.html
          grep -q '<html' /tmp/search.html
          grep -q 'NowPulse' /tmp/search.html
          image_headers="$(curl -fsSI --max-time 20 "$SITE/api/image?q=football")"
          echo "$image_headers"
          echo "$image_headers" | grep -Eiq 'content-type: image/'
          story_id="$(echo "$news" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.latest?.[0]?.id)process.exit(1);process.stdout.write(encodeURIComponent(x.latest[0].id))})')"
          curl -fsSL --max-time 25 "$SITE/article/$story_id?lang=ar" -o /tmp/article.html
          grep -q '<h1>' /tmp/article.html
          grep -q 'article-content' /tmp/article.html
          grep -q 'NowPulse' /tmp/article.html
          ! grep -Eiq 'news\.google\.com/rss|https://news\.google\.com/rss' /tmp/article.html
          headers="$(curl -fsSI --max-time 20 "$SITE/?lang=ar")"
          echo "$headers"
          echo "$headers" | grep -Eiq 'x-content-type-options: nosniff'
          echo "$headers" | grep -Eiq 'x-frame-options: DENY'
