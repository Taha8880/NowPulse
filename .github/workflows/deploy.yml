name: NowPulse CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate JavaScript
        run: npm run check

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Validate product contract
        run: npm run test:contract

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f src/worker.js
          test -f wrangler.jsonc
          test -f src/ai-guardian.js
          test -f src/nowpulse-maintenance-workflow.js
          test -f ai-manager.js
          test -f ai-manager.wrangler.jsonc
          test -f .github/workflows/validate-pr.yml
          test -f .github/workflows/self-heal.yml
          test -f .github/workflows/ai-repair-auto-merge.yml

      - name: Validate autonomous architecture
        run: |
          node <<'NODE'
          const fs = require("fs");
          const w = fs.readFileSync("wrangler.jsonc", "utf8");
          const wf = fs.readFileSync("src/nowpulse-maintenance-workflow.js", "utf8");
          for (const [name, source, needle] of [
            ["Guardian export", w, "NowPulseGuardian"],
            ["Workflow export", w, "NowPulseMaintenanceWorkflow"],
            ["Workflow type", w, '"type": "workflow"'],
            ["Workflow schedules", w, '"schedules"'],
            ["15-minute schedule", w, "*/15 * * * *"],
            ["GitHub secret access", wf, "NOWPULSE_GITHUB_TOKEN"],
            ["Guardian agent access", wf, "getAgentByName"]
          ]) {
            if (!source.includes(needle)) throw new Error("Missing autonomous contract: " + name);
          }
          console.log("Autonomous architecture contract passed.");
          NODE

      - name: Install GitHub token on NowPulse Worker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOWPULSE_GITHUB_TOKEN: ${{ secrets.NOWPULSE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NOWPULSE_GITHUB_TOKEN:-}"
          printf '%s' "$NOWPULSE_GITHUB_TOKEN" | npx wrangler secret put NOWPULSE_GITHUB_TOKEN --config wrangler.jsonc

      - name: Ensure Cloudflare maintenance Workflow
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          payload='{"class_name":"NowPulseMaintenanceWorkflow","script_name":"nowpulse","cron":"*/15 * * * *"}'
          response="$(curl -fsSL --max-time 30             -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/nowpulse-maintenance")"
          echo "$response" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const d=JSON.parse(s);
              if(!d.success) throw new Error("Cloudflare Workflow create/update failed: "+JSON.stringify(d.errors||[]));
              console.log("Cloudflare maintenance Workflow created/updated.");
            });
          '
          sleep 5
          body="$(curl -fsSL --max-time 20             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/nowpulse-maintenance")"
          echo "$body" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const d=JSON.parse(s);
              const schedules=d?.result?.schedules||[];
              if(!d.success) throw new Error("Cloudflare Workflow API returned success=false");
              if(!schedules.some(x=>x.cron==="*/15 * * * *")) throw new Error("nowpulse-maintenance is not scheduled every 15 minutes in Cloudflare");
              console.log("Cloudflare maintenance Workflow schedule verified.");
            });
          '

      - name: Final CI result
        run: echo "NowPulse CI validation passed. Production deployment is managed by Cloudflare Workers Builds."