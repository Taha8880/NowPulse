name: NowPulse AI Repair Auto Merge
on:
  workflow_run:
    workflows: ["NowPulse PR Validation"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge safe repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -e
          branch=$(gh api "/repos/$REPO/actions/runs/$RUN_ID" --jq '.head_branch')
          [[ "$branch" == ai-repair/* ]] || exit 0
          pr=$(gh pr list --repo "$REPO" --state open --head "$branch" --base main --json number,title --jq '.[]|select(.title=="NowPulse AI root-cause repair")|.number' | head -n1)
          [[ -n "$pr" ]] && gh pr merge "$pr" --repo "$REPO" --squash --delete-branch